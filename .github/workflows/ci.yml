name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Placeholder .env for compose build
        # docker-compose.yml's backend service references backend/.env via
        # env_file -- only needed at `up` time, not `build`, but some compose
        # versions validate its presence eagerly. A real key is never needed
        # to just build the images.
        run: touch backend/.env

      - name: Build images
        run: docker compose build

  deploy:
    name: Deploy to a server
    needs: [checks, docker]
    # Only for an actual landing on main -- never for a PR (`needs` already
    # implies checks/docker passed, but this also blocks PR runs from ever
    # reaching here at all) or workflow_dispatch on any other ref.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Overrides the workflow-level concurrency group above (which cancels
    # in-progress runs on a new push) -- a half-finished deploy left running
    # on the server by a cancelled job is worse than one more queued deploy
    # waiting its turn.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # TEMPORARY -- remove once the SSH auth failure is resolved. Prints
      # only the key's fingerprint (a hash), never the key material itself,
      # so it's safe to leave in a public log. Compare this to
      # `ssh-keygen -lf ~/.ssh/deploy_key` run on the server: if the two
      # don't match, the DEPLOY_SSH_KEY secret's content doesn't actually
      # match the key in authorized_keys there (the classic cause is a
      # copy-paste that dropped/altered a character or line ending).
      - name: Debug - print DEPLOY_SSH_KEY's fingerprint
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keygen -lf /tmp/deploy_key || echo "ssh-keygen could not parse this as a private key at all"
          rm -f /tmp/deploy_key

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Optional but recommended: pin the host key instead of trusting
          # whatever key the server presents on first connect. Get it with
          # `ssh-keyscan -t ed25519 <host>` and store the full output line
          # as this secret. Leaving it unset falls back to trust-on-connect.
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail
            cd ~/bountyhunter
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
