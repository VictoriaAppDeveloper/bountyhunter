name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Placeholder .env for compose build
        # docker-compose.yml's backend service references backend/.env via
        # env_file -- only needed at `up` time, not `build`, but some compose
        # versions validate its presence eagerly. A real key is never needed
        # to just build the images.
        run: touch backend/.env

      - name: Build images
        run: docker compose build

  deploy:
    name: Deploy to a server
    needs: [checks, docker]
    # Only for an actual landing on main -- never for a PR (`needs` already
    # implies checks/docker passed, but this also blocks PR runs from ever
    # reaching here at all) or workflow_dispatch on any other ref.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Overrides the workflow-level concurrency group above (which cancels
    # in-progress runs on a new push) -- a half-finished deploy left running
    # on the server by a cancelled job is worse than one more queued deploy
    # waiting its turn.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # Loads DEPLOY_SSH_KEY into a real ssh-agent for the `ssh` steps below
      # to use, rather than going through a third-party action's own SSH
      # client implementation. Deliberate: appleboy/ssh-action (Go's
      # golang.org/x/crypto/ssh) failed to authenticate with this exact key
      # against this exact server/user, even though the key's fingerprint
      # matched, a raw TCP connect to :22 succeeded, and the very same key
      # worked fine over a normal OpenSSH client (both locally and looped
      # back on the server itself) -- pointing at an algorithm-negotiation
      # difference between that library and this server's sshd, not the key
      # or the network. Using the runner's own OpenSSH client here matches
      # the client that's already proven to work.
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin the server's host key
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.DEPLOY_HOST_FINGERPRINT }}" ]; then
            echo "${{ secrets.DEPLOY_HOST_FINGERPRINT }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Deploy over SSH
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -euo pipefail
            cd ~/bountyhunter
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
          '
