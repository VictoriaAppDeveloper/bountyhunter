name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Placeholder .env for compose build
        # docker-compose.yml's backend service references backend/.env via
        # env_file -- only needed at `up` time, not `build`, but some compose
        # versions validate its presence eagerly. A real key is never needed
        # to just build the images.
        run: touch backend/.env

      - name: Build images
        run: docker compose build

  deploy:
    name: Deploy to a server
    needs: [checks, docker]
    # Only for an actual landing on main -- never for a PR (`needs` already
    # implies checks/docker passed, but this also blocks PR runs from ever
    # reaching here at all) or workflow_dispatch on any other ref.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Overrides the workflow-level concurrency group above (which cancels
    # in-progress runs on a new push) -- a half-finished deploy left running
    # on the server by a cancelled job is worse than one more queued deploy
    # waiting its turn.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # Loads DEPLOY_SSH_KEY into a real ssh-agent for the `ssh` steps below
      # to use, rather than going through a third-party action's own SSH
      # client implementation (switched off appleboy/ssh-action after it
      # failed auth against this key/host/user for reasons that turned out
      # inconclusive -- using the runner's own OpenSSH removes that as a
      # variable entirely).
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin the server's host key
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.DEPLOY_HOST_FINGERPRINT }}" ]; then
            echo "${{ secrets.DEPLOY_HOST_FINGERPRINT }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      # TEMPORARY -- the client here got a definitive "Permission denied
      # (publickey,password)" (proof a full SSH exchange happened) while the
      # server's own sshd log showed nothing at all for that same moment.
      # Those two facts can't both be true unless this is connecting to a
      # different address than the one being watched on the server -- prints
      # exactly what DEPLOY_HOST resolves to from the runner's side, to
      # compare directly against the server's own IP (`ip a` / `curl -4
      # ifconfig.me` there).
      - name: Debug - what DEPLOY_HOST actually resolves to
        run: getent hosts "${{ secrets.DEPLOY_HOST }}" || echo "did not resolve as a hostname (already a raw IP?)"

      - name: Deploy over SSH
        run: |
          ssh -v "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -euo pipefail
            cd ~/bountyhunter
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
          '
