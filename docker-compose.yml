# Pins the Compose project name regardless of the clone directory's name --
# otherwise it defaults to that directory's basename, and two projects
# checked out into identically-named folders on the same host would collide
# on container/network/volume names (`bountieshunter_internal` twice, etc).
name: bountieshunter

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      PORT: 3001
      DB_PATH: /app/backend/data/bounties.db
    volumes:
      - db-data:/app/backend/data
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # No `ports:` -- only reachable from the frontend container over the
    # internal network. The SQLite file lives solely in the `db-data` volume,
    # never on a bind mount or inside an image layer.

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '${FRONTEND_PORT:-80}:8080'
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Opt-in: `docker compose --profile tunnel up -d` exposes the frontend via
  # a Cloudflare Quick Tunnel instead of (or alongside) the host port above --
  # no domain, no signup, and the host's real IP is never reached directly
  # (cloudflared only makes an outbound connection out to Cloudflare's edge).
  # The generated https://*.trycloudflare.com URL is printed to this
  # container's logs (`docker compose logs tunnel`) and changes if the
  # container restarts -- there's no stable hostname without owning a domain
  # and running a named tunnel instead. If you use this, firewall the host
  # (e.g. Hetzner's Cloud Firewall) to drop inbound 80/443 -- the tunnel
  # doesn't need them open, and leaving them open defeats the point.
  tunnel:
    image: cloudflare/cloudflared:2026.8.2
    command: tunnel --no-autoupdate --url http://frontend:8080
    networks:
      - internal
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - tunnel

networks:
  internal: {}

volumes:
  db-data: {}
