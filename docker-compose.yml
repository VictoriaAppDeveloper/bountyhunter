# Pins the Compose project name regardless of the clone directory's name --
# otherwise it defaults to that directory's basename, and two projects
# checked out into identically-named folders on the same host would collide
# on container/network/volume names (`bountyhunter_internal` twice, etc).
name: bountyhunter

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      PORT: 3001
      DB_PATH: /app/backend/data/bounties.db
    volumes:
      - db-data:/app/backend/data
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # No `ports:` -- only reachable from the frontend container over the
    # internal network. The SQLite file lives solely in the `db-data` volume,
    # never on a bind mount or inside an image layer.

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '${FRONTEND_PORT:-80}:8080'
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  tunnel:
    image: cloudflare/cloudflared:2026.8.2
    command: tunnel --no-autoupdate --url http://frontend:8080
    networks:
      - internal
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - tunnel

networks:
  internal: {}

volumes:
  db-data: {}
