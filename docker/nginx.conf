# conf.d/*.conf is included inside the base image's http{} block, so a
# top-level map (only valid at http scope) can live in this same file.
# Standard nginx WS-upgrade recipe: absent Upgrade header -> "close" (plain
# HTTP request), present -> "upgrade" (proxy the WebSocket handshake).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-only security headers, defined here and applied per-location below
    # (not at server level) so they don't stack with the backend's own
    # headers (@fastify/helmet) on proxied /api/ responses -- two different
    # X-Frame-Options values on one response is worse than either alone.
    # CSP is scoped to what this SPA actually needs: same-origin
    # scripts/styles/xhr/ws only, no inline scripts, images allowed as data: URIs
    # (used by a couple of inline SVG icons). Tighten further only after checking
    # against the built app -- a stricter CSP is easy to ship broken silently.

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Hashed build assets (script/style/etc filenames include a content hash) --
    # safe to cache forever, a new deploy ships new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Proxied to the backend service on the compose network -- never published
    # to the host directly (see docker-compose.yml), so this is the only path
    # into it. X-Forwarded-For is *overwritten* with $remote_addr rather than
    # appended, so a client can't spoof it to defeat the backend's per-IP rate
    # limiting (see server.ts's trustProxy).
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /api/events; a no-op for every other /api/
        # request since $connection_upgrade resolves to "close" without an
        # Upgrade header.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # /api/events is a long-lived WebSocket -- buffering/caching it would
        # delay or batch live updates, and the read timeout must outlast the
        # 25s ping the backend sends to keep the connection alive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
